<h2>Logg inn på Drømmevev</h2>

<p>Trykk på lenken nedenfor for å logge inn. Den fungerer i én time, og bare én gang.</p>

<p><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=magiclink">Logg inn</a></p>

<p>Eller bruk denne engangskoden hvis lenken ikke fungerer:</p>
<p><strong style="font-size: 24px; letter-spacing: 4px;">{{ .Token }}</strong></p>

<p style="color: #888; font-size: 12px;">
  Hvis du ikke ba om denne e-posten kan du trygt ignorere den.<br>
  — Drømmevev fra aiakaki
</p>

<h2>Velkommen til Drømmevev</h2>

<p>Bekreft e-postadressen din for å fullføre registreringen:</p>

<p><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=signup">Bekreft og logg inn</a></p>

<p>Eller bruk denne engangskoden:</p>
<p><strong style="font-size: 24px; letter-spacing: 4px;">{{ .Token }}</strong></p>

<p style="color: #888; font-size: 12px;">
  Hvis du ikke opprettet en Drømmevev-konto, kan du trygt ignorere denne e-posten.<br>
  — Drømmevev fra aiakaki
</p>
